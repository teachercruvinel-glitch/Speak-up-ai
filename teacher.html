<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speak Up Teacher</title><style>body{font:16px system-ui;background:#f2f5fb;padding:20px;color:#1f2937}main{max-width:850px;margin:auto;background:white;padding:28px;border-radius:16px}input{padding:12px;margin:5px;border:1px solid #ccc;border-radius:7px}button{padding:11px 17px;background:#2563eb;color:white;border:0;border-radius:8px;cursor:pointer}article{padding:15px;border-bottom:1px solid #ddd}audio{width:100%;margin:8px 0}.muted{color:#6b7280}#error{color:#b91c1c}</style></head><body><main><h1>🎙️ Speak Up · Teacher Dashboard</h1><section id="login"><p>Sign in with your teacher account.</p><input id="email" type="email" placeholder="Teacher email"><input id="password" type="password" placeholder="Password"><button id="signIn">Sign in</button></section><section id="dashboard" hidden><button id="refresh">Refresh results</button> <button id="signOut">Sign out</button><div id="list"></div></section><p id="error"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const $=id=>document.getElementById(id);let client;async function init(){let c=await(await fetch('/.netlify/functions/config')).json();client=createClient(c.supabaseUrl,c.supabaseAnonKey);let {data}=await client.auth.getSession();if(data.session)await load()};async function authGet(path){let {data}=await client.auth.getSession();let res=await fetch('/.netlify/functions/'+path,{headers:{Authorization:'Bearer '+data.session?.access_token}});let json=await res.json();if(!res.ok)throw Error(json.error||'Request failed');return json}async function load(){try{let {assessments}=await authGet('results');$('login').hidden=true;$('dashboard').hidden=false;$('list').replaceChildren();for(let a of assessments){let article=document.createElement('article');let title=document.createElement('h3');title.textContent=`${a.student_name} · ${a.status==='graded'?a.score+'/100 · '+a.level:'Pending grade'}`;article.append(title);let date=document.createElement('p');date.className='muted';date.textContent=new Date(a.created_at).toLocaleString();article.append(date);if(a.feedback){let p=document.createElement('p');p.textContent=a.feedback.summary||'';article.append(p)}for(let q=1;q<=10;q++){let btn=document.createElement('button');btn.textContent=`Listen Q${q}`;btn.style.margin='4px';btn.onclick=async()=>{try{let {url}=await authGet('play?id='+encodeURIComponent(a.id)+'&q='+q);let audio=document.createElement('audio');audio.controls=true;audio.src=url;btn.replaceWith(audio)}catch(e){$('error').textContent=e.message}};article.append(btn)}$('list').append(article)}}catch(e){$('error').textContent=e.message}}$('signIn').onclick=async()=>{try{let {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await load()}catch(e){$('error').textContent=e.message}};$('refresh').onclick=load;$('signOut').onclick=async()=>{await client.auth.signOut();location.reload()};init().catch(e=>$('error').textContent=e.message);
</script></body></html>
